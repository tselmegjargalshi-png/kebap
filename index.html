<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ateş Kebap | Dijital Menü</title>
<meta name="description" content="Ateş Kebap Kebapçı dijital menü. Közde pişen gelenek.">
<meta name="theme-color" content="#070605">
<link rel="icon" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<meta property="og:title" content="Ateş Kebap">
<meta property="og:description" content="Közün ateşi, ustanın eli.">
<meta property="og:image" content="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,600;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<canvas id="sparks"></canvas>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><img src="/assets/icon.png" alt="Ateş Kebap"><b>Ateş <i>Kebap</i></b></div>
      <button class="ibtn" id="bSearch" aria-label="Ara"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="ibtn" id="bFilter" aria-label="Alerji filtresi"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4-2v-4Z"/></svg><span class="dot" id="fDot"></span></button>
    </div>
    <div class="searchrow" id="sRow"><input id="q" type="search" placeholder="Menüde ara…" autocomplete="off"></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <section class="hero" id="hero">
    <canvas id="embers"></canvas>
    <img class="logo" src="/assets/logo.png" alt="Ateş Kebap Kebapçı">
    <p class="slogan" id="slogan"></p>
    <svg class="ember" viewBox="0 0 200 34"><path d="M0 17h78M122 17h78" stroke="#d9a441" stroke-width="1.5" opacity=".7"/><path d="M100 2c1.2 6-2.6 9-5.6 12.8C91.4 18 89 21 89 26a11 11 0 0 0 22 0c0-3.6-1.8-6.6-3.6-8.8-.6 2.2-1.8 3.6-3.6 4.2 1.6-6.6-.4-13.8-3.8-19.4Z" fill="currentColor"/></svg>
    <div class="notice" id="notice"></div>
  </section>

  <section id="featWrap"></section>
  <div id="menu"></div>

  <section class="legend">
    <h2>alerjenler.</h2>
    <div class="lg" id="lg"></div>
  </section>

  <footer class="foot">
    <svg class="ember" viewBox="0 0 200 34"><path d="M0 17h78M122 17h78" stroke="#d9a441" stroke-width="1.5" opacity=".7"/><path d="M100 2c1.2 6-2.6 9-5.6 12.8C91.4 18 89 21 89 26a11 11 0 0 0 22 0c0-3.6-1.8-6.6-3.6-8.8-.6 2.2-1.8 3.6-3.6 4.2 1.6-6.6-.4-13.8-3.8-19.4Z" fill="currentColor"/></svg>
    <p id="allergyNote"></p>
    <div class="fs" id="fs"></div>
  </footer>
</main>

<div class="sheet" id="sheet">
  <div class="bg" id="sheetBg"></div>
  <div class="panel">
    <h3>Alerjilerim</h3>
    <p>Seçtiğiniz alerjenleri içeren ürünler uyarıyla işaretlenir.</p>
    <div class="chips" id="chips"></div>
    <div class="row"><span>Uygun olmayan ürünleri gizle</span><button class="sw" id="swHide" aria-label="Gizle"></button></div>
    <div class="btns"><button class="btn ghost" id="clr">Temizle</button><button class="btn gold" id="done">Tamam</button></div>
  </div>
</div>

<script src="/assets/common.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
